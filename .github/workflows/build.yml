name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # ggml defaults to -march=native, which would tie a release to the runner:
  # pin an AVX2 baseline (x86 from ~2013), inert on arm64. The BLAS probe is
  # off because the cgo link never provides a BLAS on Linux or Windows.
  TRANSCRIBE_CMAKE_ARGS: >-
    -DGGML_NATIVE=OFF
    -DGGML_SSE42=ON
    -DGGML_AVX=ON
    -DGGML_AVX2=ON
    -DGGML_FMA=ON
    -DGGML_F16C=ON
    -DGGML_BMI2=ON
    -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-ffi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Rust tests
        working-directory: rust-ffi
        run: cargo test --release

      - name: Build speech library
        run: bash scripts/build-rust-ffi.sh

      # main.go embeds frontend/dist, so the frontend must exist before any go command.
      - name: Frontend build and tests
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run --if-present test

      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...

      # Catches a dependency going vulnerable between releases, which is how
      # the grpc and stdlib advisories reached this tree in the first place.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build ${{ matrix.platform }}/${{ matrix.arch }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Ubuntu runner still offered: the binary links the runner's
          # glibc and libstdc++, so this is what lets Ubuntu 22.04 and Debian 12 run it.
          - os: ubuntu-22.04
            platform: linux
            arch: amd64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            arch: amd64
            rust-target: x86_64-pc-windows-gnu
          # Both macOS builds run on Apple silicon; the Intel one cross-compiles.
          - os: macos-latest
            platform: darwin
            arch: amd64
            rust-target: x86_64-apple-darwin
          - os: macos-latest
            platform: darwin
            arch: arm64
            rust-target: aarch64-apple-darwin

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-ffi
          key: ${{ matrix.rust-target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        run: |
          choco install mingw nsis -y --no-progress
          # Installed for the machine, not for this job's shell: later steps need it on PATH.
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      - name: Write credentials from secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          WITAI_KEYS: ${{ secrets.WITAI_KEYS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials/google-credentials.json
          node scripts/embed-witai-keys.js

      - name: Stamp version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$VERSION" > version.txt
          python3 - <<'PY'
          import json, os, re
          version = re.sub(r"^v", "", os.environ["VERSION"]) or "0.0.0"
          with open("wails.json") as f:
              config = json.load(f)
          config.setdefault("info", {})["productVersion"] = version
          with open("wails.json", "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
          cat wails.json

      - name: Build speech library
        run: bash scripts/build-rust-ffi.sh ${{ matrix.rust-target }}

      - name: Build for Linux
        if: matrix.platform == 'linux'
        run: wails build -platform linux/${{ matrix.arch }} -skipbindings -tags webkit2_41 -o myscript-${{ matrix.arch }}

      - name: Build for Windows
        if: matrix.platform == 'windows'
        run: wails build -platform windows/${{ matrix.arch }} -skipbindings -webview2 embed -nsis

      # ditto, not zip: a .app carries symlinks and extended attributes that
      # `zip` silently drops, which breaks the bundle the updater installs.
      # The ZIP is what the in-app updater downloads; the DMG is for people.
      - name: Package for macOS
        if: matrix.platform == 'darwin'
        run: |
          wails build -platform darwin/${{ matrix.arch }} -skipbindings
          cd build/bin
          app=$(ls -d *.app | head -n 1)
          test -n "$app" || { echo "wails produced no .app bundle"; exit 1; }

          ditto -c -k --sequesterRsrc --keepParent "$app" myscript-darwin-${{ matrix.arch }}.zip

          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname MyScript -srcfolder "$staging" -ov -format UDZO \
            myscript-darwin-${{ matrix.arch }}.dmg
          rm -rf "$staging"

      # The in-app updater downloads whichever of these matches the install:
      # the tarball and the AppImage replace themselves, the distro packages
      # are handed to the package manager through polkit.
      - name: Package for Linux
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for packager in deb rpm archlinux; do
            docker run --rm -v "$PWD:/src" -w /src -e VERSION goreleaser/nfpm package \
              --config nfpm.yaml --target build/bin --packager "$packager"
          done
          cd build/bin
          mv *.deb myscript-linux-${{ matrix.arch }}.deb
          mv *.rpm myscript-linux-${{ matrix.arch }}.rpm
          mv *.pkg.tar.zst myscript-linux-${{ matrix.arch }}.pkg.tar.zst
          tar czf myscript-linux-${{ matrix.arch }}.tar.gz myscript-${{ matrix.arch }}

      - name: Build AppImage
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-appimage.sh ${{ matrix.arch }}

      - name: Name Windows artifacts
        if: matrix.platform == 'windows'
        run: |
          cd build/bin
          ls -la
          installer=$(ls *-installer.exe 2>/dev/null | head -n 1)
          test -n "$installer" || { echo "NSIS produced no installer"; exit 1; }
          mv "$installer" myscript-windows-${{ matrix.arch }}-installer.exe
          app=$(ls *.exe | grep -v -- '-installer.exe' | head -n 1)
          test -n "$app" || { echo "no application exe"; exit 1; }
          mv "$app" myscript-windows-${{ matrix.arch }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: myscript-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/bin/*.deb
            build/bin/*.rpm
            build/bin/*.pkg.tar.zst
            build/bin/*.AppImage
            build/bin/*.tar.gz
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
