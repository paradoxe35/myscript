name: "myscript"
version: "${VERSION}"
arch: "amd64"
platform: "linux"
maintainer: "Paradoxe Ngwasi <paradoxngwasi@gmail.com>"
description: "A Notion-like application tailored for content producers."
license: "MIT"
homepage: "https://myscript.app"
vendor: "Paradoxe Ngwasi"
contents:
  # Binary
  - src: build/bin/myscript-amd64
    dst: /usr/bin/myscript
    file_info:
      mode: 0755

  # Desktop Entry
  - src: build/linux/myscript.desktop
    dst: /usr/share/applications/myscript.desktop
    file_info:
      mode: 0644

  # Application Icon
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/256x256/apps/myscript.png
    file_info:
      mode: 0644

  # AppStream Metadata
  - src: build/linux/myscript.appdata.xml
    dst: /usr/share/metainfo/myscript.appdata.xml
    file_info:
      mode: 0644

# Desktop integration and microphone capture dependencies.
# The webview is what actually renders the app: without it the binary installs
# and then fails to open a window.
depends:
  - libwebkit2gtk-4.1-0
  - libasound2 | libasound2t64
  - libgtk-3-0
  - libnotify4
  - libnss3
  - libxss1
  - libxtst6
  - xdg-utils
  - libatspi2.0-0
  - libappindicator3-1

# Package names are distribution-specific, so the Debian list above would make
# the rpm and arch packages refuse to install.
overrides:
  rpm:
    depends:
      - webkit2gtk4.1
      - alsa-lib
      - gtk3
      - libnotify
      - nss
      - libXScrnSaver
      - libXtst
      - xdg-utils
      - at-spi2-atk
  archlinux:
    depends:
      - webkit2gtk-4.1
      - alsa-lib
      - gtk3
      - libnotify
      - nss
      - libxss
      - libxtst
      - xdg-utils
      - at-spi2-atk

# Maintainer scripts (create these in build/linux/)
scripts:
  postinstall: build/linux/postinst.sh
  preremove: build/linux/prerm.sh
